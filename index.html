<!doctype html>
<html lang="en" className="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kenfoss Refrigeration Limited | Kenya's Premier Cold Room & HVAC Engineers</title>
    <meta name="description" content="Kenfoss Refrigeration Limited is Kenya's trusted partner in commercial cold room installation, HVAC engineering, refrigerator repair, and preventive maintenance." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://apis.google.com https://*.firebaseapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com ws: wss:; frame-src 'self' https://*.firebaseapp.com https://*.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Suppress benign Vite HMR WebSocket disconnect errors in container runtime
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e && e.reason ? (e.reason.message || e.reason.stack || e.reason) : '';
        if (msg && (msg.toString().toLowerCase().includes('websocket') || msg.toString().toLowerCase().includes('ws'))) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = e && e.message ? e.message : '';
        if (msg && (msg.toString().toLowerCase().includes('websocket') || msg.toString().toLowerCase().includes('ws'))) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
