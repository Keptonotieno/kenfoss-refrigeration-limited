<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Corporate Navy Gradient -->
    <linearGradient id="kenfossBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B5B"/>
      <stop offset="50%" stop-color="#001F42"/>
      <stop offset="100%" stop-color="#00142B"/>
    </linearGradient>

    <!-- Kenfoss Brand Blue to Cyan Gradient -->
    <linearGradient id="blueCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0057B8"/>
      <stop offset="100%" stop-color="#00AEEF"/>
    </linearGradient>

    <!-- Cooling Frost Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>

    <!-- Orange Accent Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Rect Container -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#kenfossBg)"/>
  
  <!-- Subtle Glowing Inner Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="84" fill="none" stroke="url(#blueCyanGrad)" stroke-width="6" opacity="0.5"/>

  <!-- Background Decorative Cooling Hex Path -->
  <path d="M256 40 L440 146 V366 L256 472 L72 366 V146 Z" fill="none" stroke="url(#blueCyanGrad)" stroke-width="3" opacity="0.15"/>

  <!-- Central Kenfoss "K" Shield Badge -->
  <g transform="translate(0, -10)">
    <!-- Shield Container -->
    <rect x="126" y="80" width="260" height="260" rx="48" fill="url(#blueCyanGrad)" filter="url(#glow)"/>
    
    <!-- White Bold Monogram 'K' inside shield -->
    <path d="M 176 120 L 216 120 L 216 300 L 176 300 Z
             M 216 210 L 290 120 L 342 120 L 260 210 L 348 300 L 294 300 Z" 
          fill="#FFFFFF"/>

    <!-- Integrated Snowflake / Refrigerator Frost Node on 'K' -->
    <g transform="translate(325, 210)" stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round">
      <line x1="-24" y1="0" x2="24" y2="0"/>
      <line x1="0" y1="-24" x2="0" y2="24"/>
      <line x1="-16" y1="-16" x2="16" y2="16"/>
      <line x1="-16" y1="16" x2="16" y2="-16"/>
      <circle cx="0" cy="0" r="8" fill="#FF7A00" stroke="none"/>
    </g>
  </g>

  <!-- Typography: KENFOSS -->
  <text x="256" y="410" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="52" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="4">KENFOSS</text>

  <!-- Subtext / Badge: REFRIGERATION • KE -->
  <g transform="translate(256, 450)">
    <rect x="-130" y="-18" width="260" height="26" rx="6" fill="#001F42" stroke="url(#blueCyanGrad)" stroke-width="2"/>
    <text x="-10" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" 
          font-size="14" 
          fill="#00AEEF" 
          text-anchor="middle" 
          letter-spacing="2">REFRIGERATION</text>
    <!-- KE pill -->
    <rect x="75" y="-12" width="36" height="16" rx="4" fill="url(#orangeGrad)"/>
    <text x="93" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="11" 
          fill="#FFFFFF" 
          text-anchor="middle">KE</text>
  </g>
</svg>
