<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B5B"/>
      <stop offset="100%" stop-color="#020D1C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Shield Background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.6"/>
  
  <!-- Outer Cooling Hex Shield -->
  <path d="M256 72 L416 160 V336 L256 432 L96 336 V160 Z" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Central Snowflake & Refrigerator Core -->
  <g fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical line -->
    <line x1="256" y1="140" x2="256" y2="352"/>
    <!-- Diagonal 1 -->
    <line x1="164" y1="193" x2="348" y2="299"/>
    <!-- Diagonal 2 -->
    <line x1="164" y1="299" x2="348" y2="193"/>
    
    <!-- Snowflake Branch Tips -->
    <!-- Top branch -->
    <path d="M228 168 L256 140 L284 168"/>
    <!-- Bottom branch -->
    <path d="M228 324 L256 352 L284 324"/>
    <!-- Top-Left branch -->
    <path d="M178 226 L164 193 L202 188"/>
    <!-- Bottom-Right branch -->
    <path d="M334 270 L348 299 L310 305"/>
    <!-- Bottom-Left branch -->
    <path d="M178 266 L164 299 L202 305"/>
    <!-- Top-Right branch -->
    <path d="M334 222 L348 193 L310 188"/>
  </g>
  
  <!-- Glowing Center Core Node -->
  <circle cx="256" cy="246" r="28" fill="url(#accentGrad)"/>
  <circle cx="256" cy="246" r="14" fill="#FFFFFF"/>
</svg>
