<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Corporate Navy Gradient -->
    <linearGradient id="kenfossBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002B5B"/>
      <stop offset="50%" stop-color="#001F42"/>
      <stop offset="100%" stop-color="#00142B"/>
    </linearGradient>

    <!-- Kenfoss Brand Blue to Cyan Gradient -->
    <linearGradient id="blueCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0057B8"/>
      <stop offset="100%" stop-color="#00AEEF"/>
    </linearGradient>

    <!-- Orange Accent Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Square Background (Required for Maskable PWA Icon) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#kenfossBg)"/>
  
  <!-- Subtle Outer Safe Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#blueCyanGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Content scaled inside 80% safe zone radius -->
  <g transform="translate(0, -10)">
    <!-- Central Kenfoss "K" Shield Badge -->
    <rect x="146" y="90" width="220" height="220" rx="40" fill="url(#blueCyanGrad)" filter="url(#glow)"/>
    
    <!-- White Monogram 'K' -->
    <path d="M 188 124 L 222 124 L 222 276 L 188 276 Z
             M 222 200 L 285 124 L 329 124 L 259 200 L 334 276 L 288 276 Z" 
          fill="#FFFFFF"/>

    <!-- Integrated Snowflake / Refrigerator Frost Node on 'K' -->
    <g transform="translate(315, 200)" stroke="url(#orangeGrad)" stroke-width="8" stroke-linecap="round">
      <line x1="-20" y1="0" x2="20" y2="0"/>
      <line x1="0" y1="-20" x2="0" y2="20"/>
      <line x1="-14" y1="-14" x2="14" y2="14"/>
      <line x1="-14" y1="14" x2="14" y2="-14"/>
      <circle cx="0" cy="0" r="7" fill="#FF7A00" stroke="none"/>
    </g>

    <!-- Typography: KENFOSS -->
    <text x="256" y="370" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="44" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="3">KENFOSS</text>

    <!-- Subtext / Badge: REFRIGERATION • KE -->
    <g transform="translate(256, 405)">
      <rect x="-115" y="-16" width="230" height="24" rx="5" fill="#001F42" stroke="url(#blueCyanGrad)" stroke-width="2"/>
      <text x="-10" y="0" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-weight="700" 
            font-size="12" 
            fill="#00AEEF" 
            text-anchor="middle" 
            letter-spacing="2">REFRIGERATION</text>
      <rect x="65" y="-11" width="32" height="14" rx="3" fill="url(#orangeGrad)"/>
      <text x="81" y="0" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-weight="900" 
            font-size="10" 
            fill="#FFFFFF" 
            text-anchor="middle">KE</text>
    </g>
  </g>
</svg>
